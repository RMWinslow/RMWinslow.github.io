<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USD Beacom Course Search</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 6px;
    }

    h1 {
      margin: 0 0 5px;
    }

    #search-form {
      display: grid;
      grid-template-columns: max-content max-content minmax(16rem, 1fr);
      gap: 4px;
      align-items: stretch;
    }

    #search-form > fieldset {
      margin-bottom: 0;
    }

    fieldset {
      min-width: 0;
      margin-bottom: 4px;
    }

    p {
      margin-bottom: 4px;
    }

    #term-options {
      columns: auto;
    }

    #term-options > div {
      white-space: nowrap;
    }

    #subject-options {
      display: grid;
      grid-template-columns: max-content;
      gap: 2px 3px;
      align-items: start;
    }

    #subject-options fieldset {
      display: block;
      margin: 0;
    }

    #other-options {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    #other-options > fieldset {
      margin: 0;
    }

    #search-controls {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    #search-button {
      font-size: 1.25em;
    }

    input[type="search"] {
      width: 20rem;
      max-width: 100%;
    }

    #status,
    #warning {
      margin: 3px 0;
    }

    #status:empty,
    #warning:empty,
    #terms-status:empty {
      display: none;
    }

    #warning {
      font-weight: bold;
    }

    table {
      width: 100%;
      border: 2px inset #eee;
      border-spacing: 0;
      color: #000;
      background: #fff;
      font: 1em/1.25 "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    caption {
      padding: 2px 3px;
      border: 2px outset #eee;
      caption-side: top;
      background: #c0c0c0;
      font-weight: bold;
      text-align: left;
    }

    th,
    td {
      padding: 1px 3px;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
      text-align: left;
      vertical-align: top;
    }

    th {
      border-top: 1px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      border-left: 1px solid #fff;
      background: #c0c0c0;
      white-space: nowrap;
    }

    td {
      white-space: nowrap;
    }

    td:nth-child(5),
    td:nth-child(7),
    td:nth-child(8),
    td:nth-child(9),
    td:nth-child(12) {
      white-space: normal;
    }

    tbody tr:nth-child(even) td {
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>USD Beacom Course Search</h1>

  <fieldset>
    <form id="search-form">
    <fieldset id="semester-options">
      <legend>Semesters</legend>
      <p id="terms-status" role="status">Loading semesters...</p>
      <div id="term-options"></div>
      <p>
        <button id="select-all-terms" type="button">Select all</button>
        <button id="deselect-all-terms" type="button">Deselect all</button>
      </p>
    </fieldset>

    <fieldset id="subject-filter">
      <legend>Subjects</legend>

      <div id="subject-options">
        <fieldset>
          <legend>ECON/DSCI</legend>
          <div>
            <input id="subject-econ" name="subject" type="checkbox" value="ECON" checked>
            <label for="subject-econ">Economics (ECON)</label>
          </div>
          <div>
            <input id="subject-dsci" name="subject" type="checkbox" value="DSCI" checked>
            <label for="subject-dsci">Decision Sciences (DSCI)</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ACCT/FIN</legend>
          <div>
            <input id="subject-acct" name="subject" type="checkbox" value="ACCT" checked>
            <label for="subject-acct">Accounting (ACCT)</label>
          </div>
          <div>
            <input id="subject-fin" name="subject" type="checkbox" value="FIN" checked>
            <label for="subject-fin">Finance (FIN)</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>EMM</legend>
          <div>
            <input id="subject-badm" name="subject" type="checkbox" value="BADM" checked>
            <label for="subject-badm">Business Administration (BADM)</label>
          </div>
          <div>
            <input id="subject-blaw" name="subject" type="checkbox" value="BLAW" checked>
            <label for="subject-blaw">Business Law (BLAW)</label>
          </div>
          <div>
            <input id="subject-entr" name="subject" type="checkbox" value="ENTR" checked>
            <label for="subject-entr">Entrepreneurship (ENTR)</label>
          </div>
          <div>
            <input id="subject-hrm" name="subject" type="checkbox" value="HRM" checked>
            <label for="subject-hrm">Human Resource Management (HRM)</label>
          </div>
          <div>
            <input id="subject-mgmt" name="subject" type="checkbox" value="MGMT" checked>
            <label for="subject-mgmt">Management (MGMT)</label>
          </div>
          <div>
            <input id="subject-mktg" name="subject" type="checkbox" value="MKTG" checked>
            <label for="subject-mktg">Marketing (MKTG)</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>HSAD</legend>
          <div>
            <input id="subject-hsad" name="subject" type="checkbox" value="HSAD" checked>
            <label for="subject-hsad">Health Services Administration (HSAD)</label>
          </div>
        </fieldset>
      </div>

      <div>
        <input id="subject-other" name="subject" type="checkbox" value="__OTHER__" checked>
        <label for="subject-other">Other (EMBA, UHON, etc.)*</label>
      </div>
      <p><small>*Includes every subject not listed above.</small></p>

      <p>
        <button id="select-all-subjects" type="button">Select all</button>
        <button id="deselect-all-subjects" type="button">Deselect all</button>
      </p>
    </fieldset>

    <div id="other-options">
      <fieldset id="instructor-filter">
        <legend>Other</legend>
        <p>
          <label for="instructor">Instructor name:</label>
          <input id="instructor" name="instructor" type="search">
        </p>
      </fieldset>

      <fieldset id="column-filter">
        <legend>Columns</legend>
        <div><input id="column-semester" type="checkbox" data-column="1" checked> <label for="column-semester">Semester</label></div>
        <div><input id="column-course" type="checkbox" data-column="2" checked> <label for="column-course">Course</label></div>
        <div><input id="column-section" type="checkbox" data-column="3" checked> <label for="column-section">Section</label></div>
        <div><input id="column-crn" type="checkbox" data-column="4" checked> <label for="column-crn">CRN</label></div>
        <div><input id="column-title" type="checkbox" data-column="5" checked> <label for="column-title">Title</label></div>
        <div><input id="column-credits" type="checkbox" data-column="6" checked> <label for="column-credits">Credits</label></div>
        <div><input id="column-instructor" type="checkbox" data-column="7" checked> <label for="column-instructor">Instructor</label></div>
        <div><input id="column-schedule-type" type="checkbox" data-column="8" checked> <label for="column-schedule-type">Schedule type</label></div>
        <div><input id="column-instructional-method" type="checkbox" data-column="9" checked> <label for="column-instructional-method">Instructional method</label></div>
        <div><input id="column-days" type="checkbox" data-column="10" checked> <label for="column-days">Days</label></div>
        <div><input id="column-time" type="checkbox" data-column="11" checked> <label for="column-time">Time</label></div>
        <div><input id="column-building" type="checkbox" data-column="12" checked> <label for="column-building">Building</label></div>
        <div><input id="column-room" type="checkbox" data-column="13" checked> <label for="column-room">Room</label></div>
        <div><input id="column-enrollment" type="checkbox" data-column="14" checked> <label for="column-enrollment">Enrollment</label></div>
        <div><input id="column-start-date" type="checkbox" data-column="15"> <label for="column-start-date">Start date</label></div>
        <div><input id="column-end-date" type="checkbox" data-column="16"> <label for="column-end-date">End date</label></div>
      </fieldset>
    </div>

    <p id="search-controls">
      <button id="search-button" type="submit">Search</button>
    </p>
    </form>
  </fieldset>

  <p id="status" role="status" aria-live="polite"></p>
  <p id="warning" role="alert"></p>

  <table id="results-table">
    <caption id="results-caption">Course results</caption>
    <thead>
      <tr>
        <th scope="col">Semester</th>
        <th scope="col">Course</th>
        <th scope="col">Section</th>
        <th scope="col">CRN</th>
        <th scope="col">Title</th>
        <th scope="col">Credits</th>
        <th scope="col">Instructor</th>
        <th scope="col">Type</th>
        <th scope="col">Method</th>
        <th scope="col">Days</th>
        <th scope="col">Time</th>
        <th scope="col">Building</th>
        <th scope="col">Room</th>
        <th scope="col">Enrollment</th>
        <th scope="col">Start date</th>
        <th scope="col">End date</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>

  <!-- TODO: Add pagination so a semester with a source query above 500 sections can be retrieved in full. -->
  <script>
    "use strict";

    const API_ROOT = "https://usd-beacom-catalog-api.rmwinslow.workers.dev/api";
    const SIMULTANEOUS_REQUESTS = 4;
    const OTHER_SUBJECT = "__OTHER__";

    const form = document.getElementById("search-form");
    const termOptions = document.getElementById("term-options");
    const termsStatus = document.getElementById("terms-status");
    const instructorInput = document.getElementById("instructor");
    const searchButton = document.getElementById("search-button");
    const status = document.getElementById("status");
    const warning = document.getElementById("warning");
    const columnFilter = document.getElementById("column-filter");
    const resultsTable = document.getElementById("results-table");
    const resultsCaption = document.getElementById("results-caption");
    const resultsBody = document.getElementById("results-body");
    const entityDecoder = document.createElement("textarea");
    const listedSubjects = new Set(Array.from(
      form.querySelectorAll('input[name="subject"]'),
      (checkbox) => checkbox.value
    ).filter((subject) => subject !== OTHER_SUBJECT));

    async function getJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      let payload;

      try {
        payload = await response.json();
      } catch (error) {
        throw new Error(`The course service returned HTTP ${response.status}.`);
      }

      if (!response.ok) {
        throw new Error(payload.error || `The course service returned HTTP ${response.status}.`);
      }
      return payload;
    }

    function renderTerms(terms) {
      termOptions.replaceChildren();

      for (const [index, term] of terms.entries()) {
        const line = document.createElement("div");
        const checkbox = document.createElement("input");
        const label = document.createElement("label");
        const description = term.description.replace(/\s*\(View Only\)\s*$/, "");

        checkbox.type = "checkbox";
        checkbox.name = "term";
        checkbox.value = term.code;
        checkbox.id = `term-${term.code}`;
        checkbox.dataset.description = description;
        checkbox.checked = index === 0;

        label.htmlFor = checkbox.id;
        label.textContent = description;

        line.append(checkbox, " ", label);
        termOptions.appendChild(line);
      }

      termsStatus.textContent = terms.length
        ? ""
        : "No semesters were returned by SDBOR.";
    }

    function setCheckboxes(name, checked) {
      for (const checkbox of form.querySelectorAll(`input[name="${name}"]`)) {
        checkbox.checked = checked;
      }
    }

    async function loadTerms() {
      try {
        const terms = await getJson(`${API_ROOT}/terms`);
        renderTerms(terms);
      } catch (error) {
        termsStatus.textContent = `Could not load semesters: ${error.message}`;
        searchButton.disabled = true;
      }
    }

    async function mapWithLimit(values, limit, callback) {
      const results = new Array(values.length);
      let nextIndex = 0;

      async function worker() {
        while (nextIndex < values.length) {
          const index = nextIndex;
          nextIndex += 1;
          results[index] = await callback(values[index], index);
        }
      }

      const workers = Array.from(
        { length: Math.min(limit, values.length) },
        () => worker()
      );
      await Promise.all(workers);
      return results;
    }

    function unique(values) {
      return Array.from(new Set(values.filter(Boolean)));
    }

    function timeParts(value) {
      const text = value == null ? "" : String(value).trim();
      if (!/^\d{4}$/.test(text)) {
        return { text, period: "" };
      }
      const hour = Number(text.slice(0, 2));
      const minute = text.slice(2);
      return {
        text: `${hour % 12 || 12}:${minute}`,
        period: hour < 12 ? "AM" : "PM"
      };
    }

    function formatTimeRange(beginValue, endValue) {
      const begin = timeParts(beginValue);
      const end = timeParts(endValue);

      if (!begin.text || !end.text) {
        const available = begin.text ? begin : end;
        return [available.text, available.period].filter(Boolean).join(" ");
      }

      const finalPeriod = begin.period && begin.period === end.period
        ? ` ${end.period}`
        : "";
      return `${begin.text}-${end.text}${finalPeriod}`;
    }

    function formatDays(meeting) {
      const days = [
        ["monday", "M"],
        ["tuesday", "Tu"],
        ["wednesday", "W"],
        ["thursday", "Th"],
        ["friday", "F"],
        ["saturday", "Sa"],
        ["sunday", "Su"]
      ];
      return days
        .filter(([field]) => meeting[field])
        .map(([, abbreviation]) => abbreviation)
        .join(" ");
    }

    function meetingValues(course) {
      const meetings = (course.meetingsFaculty || [])
        .map((record) => record.meetingTime || {})
        .filter((meeting) => Object.keys(meeting).length);

      return {
        days: unique(meetings.map(formatDays)),
        times: unique(meetings.map((meeting) =>
          formatTimeRange(meeting.beginTime, meeting.endTime)
        )),
        startDates: unique(meetings.map((meeting) => meeting.startDate)),
        endDates: unique(meetings.map((meeting) => meeting.endDate)),
        buildings: unique(meetings.map((meeting) =>
          meeting.buildingDescription || meeting.building || ""
        )),
        rooms: unique(meetings.map((meeting) => meeting.room))
      };
    }

    function creditText(course) {
      if (course.creditHours != null) {
        return String(course.creditHours);
      }
      const low = course.creditHourLow;
      const high = course.creditHourHigh;
      if (low == null && high == null) {
        return "";
      }
      return low === high ? String(low) : [low, high].filter((value) => value != null).join("-");
    }

    function appendCell(row, value) {
      const cell = document.createElement("td");
      entityDecoder.innerHTML = value == null ? "" : String(value);
      cell.textContent = entityDecoder.value;
      row.appendChild(cell);
    }

    function updateColumnVisibility() {
      for (const checkbox of columnFilter.querySelectorAll("input[data-column]")) {
        const cells = resultsTable.querySelectorAll(
          `tr > :nth-child(${checkbox.dataset.column})`
        );
        for (const cell of cells) {
          cell.hidden = !checkbox.checked;
        }
      }
    }

    function renderCourses(courses) {
      resultsBody.replaceChildren();

      for (const course of courses) {
        const meetings = meetingValues(course);
        const faculty = course.faculty || [];
        const instructors = unique(
          faculty.map((instructor) => instructor.displayName)
        );
        const row = document.createElement("tr");

        appendCell(row, course.termDesc);
        appendCell(row, `${course.subject || ""} ${course.courseDisplay || course.courseNumber || ""}`.trim());
        appendCell(row, course.sequenceNumber);
        appendCell(row, course.courseReferenceNumber);
        appendCell(row, course.courseTitle);
        appendCell(row, creditText(course));
        appendCell(row, instructors.join("; "));
        appendCell(row, course.scheduleTypeDescription);
        appendCell(row, course.instructionalMethodDescription);
        appendCell(row, meetings.days.join("; "));
        appendCell(row, meetings.times.join("; "));
        appendCell(row, meetings.buildings.join("; "));
        appendCell(row, meetings.rooms.join("; "));
        appendCell(row, course.enrollment == null && course.maximumEnrollment == null
          ? ""
          : `${course.enrollment ?? ""} / ${course.maximumEnrollment ?? ""}`
        );
        appendCell(row, meetings.startDates.join("; "));
        appendCell(row, meetings.endDates.join("; "));
        resultsBody.appendChild(row);
      }

      resultsCaption.textContent = `${courses.length} course result${courses.length === 1 ? "" : "s"} displayed`;
      updateColumnVisibility();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const selectedTerms = Array.from(
        form.querySelectorAll('input[name="term"]:checked'),
        (checkbox) => checkbox.value
      );
      const selectedSubjects = new Set(Array.from(
        form.querySelectorAll('input[name="subject"]:checked'),
        (checkbox) => checkbox.value
      ));
      const includeOtherSubjects = selectedSubjects.has(OTHER_SUBJECT);
      const instructorQuery = instructorInput.value.trim();

      if (!selectedTerms.length) {
        status.textContent = "Select at least one semester.";
        return;
      }
      if (!selectedSubjects.size) {
        status.textContent = "Select at least one subject.";
        return;
      }

      searchButton.disabled = true;
      warning.textContent = "";
      status.textContent = `Loading ${selectedTerms.length} semester${selectedTerms.length === 1 ? "" : "s"}...`;
      resultsBody.replaceChildren();
      resultsCaption.textContent = "Course results";

      try {
        const payloads = await mapWithLimit(
          selectedTerms,
          SIMULTANEOUS_REQUESTS,
          (term) => getJson(`${API_ROOT}/semester?term=${encodeURIComponent(term)}`)
        );
        const incompleteTerms = payloads
          .filter((payload) => payload.limitExceeded)
          .map((payload) => payload.data?.[0]?.termDesc || "an unknown semester");
        const allCourses = payloads.flatMap((payload) => payload.data || []);
        const needle = instructorQuery.toLocaleLowerCase();
        const matchingCourses = allCourses.filter((course) => {
          const subjectIsSelected = listedSubjects.has(course.subject)
            ? selectedSubjects.has(course.subject)
            : includeOtherSubjects;
          if (!subjectIsSelected) {
            return false;
          }
          if (!needle) {
            return true;
          }
          return (course.faculty || []).some((faculty) =>
            (faculty.displayName || "").toLocaleLowerCase().includes(needle)
          );
        });
        renderCourses(matchingCourses);
        status.textContent = `Search complete. ${matchingCourses.length} matching course result${matchingCourses.length === 1 ? "" : "s"} found.`;

        const warnings = [];
        if (incompleteTerms.length) {
          warnings.push(
            `WARNING: At least one SDBOR query returned more than 500 sections for ${incompleteTerms.join(", ")}. Matches beyond the first 500 cannot be counted.`
          );
        }
        warning.textContent = warnings.join(" ");
      } catch (error) {
        status.textContent = `Search failed: ${error.message}`;
      } finally {
        searchButton.disabled = false;
      }
    });

    document.getElementById("select-all-terms").addEventListener("click", () => {
      setCheckboxes("term", true);
    });
    document.getElementById("deselect-all-terms").addEventListener("click", () => {
      setCheckboxes("term", false);
    });
    document.getElementById("select-all-subjects").addEventListener("click", () => {
      setCheckboxes("subject", true);
    });
    document.getElementById("deselect-all-subjects").addEventListener("click", () => {
      setCheckboxes("subject", false);
    });
    columnFilter.addEventListener("change", updateColumnVisibility);

    updateColumnVisibility();
    loadTerms();
  </script>
</body>
</html>
