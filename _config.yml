title: Robert Winslow
description: "Professor Robert Martin Winslow's personal website."
author: Robert Winslow
remote_theme: RMWinslow/JTD-RMW
search_enabled: true
page_excerpts: true
gh_edit_link: false
math: mathjax

compress_html:
  ignore:
    envs: all


plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  
whitelist:
  - jekyll-redirect-from

exclude:
  - AGENTS.md
  - CLAUDE.md
  - claude_audits.md
  - claude_directory.md
  - mynotes_audit.md
  - search_index_audit.md
  - redirects/INDEX.md
  - .claude/

nav_external_links:
  - title: Blog
    url: https://blog.rmwinslow.com

